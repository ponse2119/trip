<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたり旅プランナー</title>
<meta name="theme-color" content="#eef4fb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#ffffff;--card2:#f4f7fc;--ink:#14213d;--sub:#5b6b8a;--line:#d6e0ee;--ac:#d9442e;--acink:#fff;--sun:#f7b23b;--link:#b34a12;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
button,input,textarea,select{font:inherit;color:inherit}
header{padding:8px 0 12px}
#title{width:100%;border:0;background:transparent;font:800 30px/1.3 "Shippori Mincho B1","Hiragino Mincho ProN",serif;padding:4px 0;border-bottom:2px dashed var(--line);letter-spacing:.02em}
#title:focus{outline:none;border-color:var(--sun)}
.meta{display:flex;gap:10px;margin-top:12px;align-items:center;color:var(--sub);font-size:14px;flex-wrap:wrap}
.meta input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px}
.meta input[type=number]{width:64px}
.count{margin-left:auto;background:var(--ac);color:var(--acink);border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px}
.count:empty{display:none}
.count b{font-size:22px;font-variant-numeric:tabular-nums;margin:0 2px}
nav.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:10px 0 16px;border:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-weight:700;color:var(--sub);cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--ac);color:var(--acink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;text-align:center;cursor:pointer;line-height:1.35;font-weight:700}
.days button small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.days button[aria-pressed=true]{background:var(--sun);color:#1a1204;border-color:var(--sun)}
.days button[aria-pressed=true] small{color:#3a2a0c}
.tk{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.tk::before,.tk::after{content:"";position:absolute;left:68px;width:16px;height:16px;border-radius:50%;background:var(--bg);z-index:1}
.tk::before{top:-8px}.tk::after{bottom:-8px}
.tk{box-shadow:0 1px 3px rgba(20,33,61,.08)}
.stub{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border-right:2px dashed var(--line);background:color-mix(in srgb,var(--cc) 20%,#fff);border-radius:13px 0 0 13px}
.stub .ic{font-size:26px;line-height:1}
.stub .tm{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tk .body{flex:1;min-width:0;padding:12px 8px 12px 14px;cursor:pointer}
.tk .side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px 6px 0}
.tk.done{opacity:.5}.tk.done .t{text-decoration:line-through}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.item.done{opacity:.5}.item.done .t{text-decoration:line-through}
.body{flex:1;min-width:0}
.t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.sub{color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.cost{display:inline-block;background:color-mix(in srgb,var(--sun) 24%,transparent);border-radius:8px;padding:0 8px;font-size:13px;margin-top:6px}
.chk{width:24px;height:24px;accent-color:var(--ac);flex:0 0 auto}
.del{border:0;background:none;color:var(--sub);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
.add select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 8px;font-size:15px}
.mini{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:4px 10px;font-size:13px;cursor:pointer}
.map{color:var(--link);text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;color:var(--sub);padding:36px 12px;border:2px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acink);border:0;border-radius:28px;padding:14px 22px;font-weight:700;box-shadow:0 6px 16px rgba(217,68,46,.35);cursor:pointer}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);width:calc(100% - 24px);max-width:520px;max-height:calc(100% - 24px);overflow:auto;padding:18px;margin:auto auto 12px}
dialog::backdrop{background:rgba(20,33,61,.45)}
dialog h2{margin:0 0 10px;font:800 19px "Shippori Mincho B1","Hiragino Mincho ProN",serif}
label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
dialog input:not([type=checkbox]),dialog select{height:46px;min-width:0}
dialog input[type=time]{-webkit-appearance:none;appearance:none;text-align:left;display:block}
dialog input[type=time]::-webkit-date-and-time-value{text-align:left}
dialog:focus{outline:none}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;border-radius:12px;padding:12px;border:1px solid var(--line);background:none;font-weight:700;cursor:pointer}
.acts .pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}
.line{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
 .add{display:flex;gap:8px;margin-bottom:12px;min-width:0;max-width:100%}
.add input{flex:1 1 0%;min-width:0;width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:16px}
.add button{flex:0 0 auto;border:0;background:var(--ac);color:var(--acink);border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}
#packForm{width:100%;min-width:0}
#packOwner{flex:0 0 92px;width:92px;min-width:0;height:48px}
#packIn{min-width:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
  <input id="title" aria-label="旅のタイトル" placeholder="旅のタイトル" maxlength="40">
  <div class="meta">
    <label style="margin:0">出発日 <input type="date" id="start"></label>
    <label style="margin:0">日数 <input type="number" id="ndays" min="1" max="30"></label>
    <span class="count" id="countdown"></span>
  </div>
  <div class="sub" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="sync">📱 この端末のみ保存</span><button id="cp" class="mini">リンクをコピー</button><button id="sw" class="mini">コード入力</button></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true">予定</button>
  <button role="tab" data-tab="wish" aria-selected="false">候補</button>
  <button role="tab" data-tab="pack" aria-selected="false">持ち物</button>
  <button role="tab" data-tab="cost" aria-selected="false">費用</button>
</nav>

<section id="plan">
  <div class="days" id="days"></div>
  <div style="margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="mini" id="calDay">📅 この日をまとめてカレンダーへ</button><label class="sub" style="margin:0">通知 <select id="alm" class="mini"><option value="0">なし</option><option value="10">10分前</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">1日前</option></select></label></div>
  <div id="list"></div>
</section>
<section id="wish" hidden>
  <form class="add" id="wishForm" style="flex-wrap:wrap"><input id="wishT" style="flex:1 1 100%" required maxlength="60" placeholder="行きたい場所・やりたいこと" aria-label="候補"><input id="wishP" maxlength="80" placeholder="場所（任意）" aria-label="場所"><button>追加</button></form>
  <div id="wishList"></div>
</section>
<section id="pack" hidden>
  <form class="add" id="packForm"><input id="packIn" placeholder="持ち物を追加" aria-label="持ち物"><select id="packOwner" aria-label="誰の持ち物"><option value="0"></option><option value="1"></option><option value="2">共用</option></select><button>追加</button></form>
  <div class="days" id="packTabs"></div>
  <div id="packList"></div>
</section>
<section id="cost" hidden></section>
</main>

<button class="fab" id="fab">＋ 予定を追加</button>

<dialog id="dlgM" autofocus tabindex="-1">
  <form method="dialog" id="fm">
    <h2 id="mh">予定に入れる</h2>
    <div class="row">
      <div><label for="mday">何日目</label><select id="mday"></select></div>
      <div><label for="mtime">時間（任意）</label><input type="time" id="mtime"></div>
    </div>
    <div class="acts"><button type="button" id="mcancel">キャンセル</button><button class="pri">予定に入れる</button></div>
  </form>
</dialog>

<dialog id="dlg" autofocus tabindex="-1">
  <form method="dialog" id="f">
    <h2 id="dh">予定を追加</h2>
    <div class="row">
      <div><label for="ftime">時間</label><input type="time" id="ftime"></div>
      <div><label for="fcost">費用（円）</label><input type="number" id="fcost" inputmode="numeric" min="0" placeholder="0"></div>
    </div>
    <label for="fcat">種類</label><select id="fcat"><option value="">おまかせ（自動）</option><option value="plane">✈️ 飛行機</option><option value="train">🚆 電車</option><option value="bus">🚌 バス</option><option value="food">🍜 食事</option><option value="sight">⛩️ 観光</option><option value="stay">🏨 宿泊</option><option value="other">📌 その他</option></select>
    <label for="fpay">支払った人（精算に使います）</label><select id="fpay"><option value="">未設定（精算に含めない）</option><option value="0" id="o0"></option><option value="1" id="o1"></option></select>
    <label for="ftitle">やること</label><input id="ftitle" required maxlength="60" placeholder="例：清水寺を散歩">
    <label for="fplace">場所</label><input id="fplace" maxlength="80" placeholder="例：京都市東山区">
    <label for="fnote">メモ</label><textarea id="fnote" rows="2" maxlength="200" placeholder="予約番号、持っていくものなど"></textarea>
    <div class="acts"><button type="button" id="cancel">キャンセル</button><button class="pri" id="save">保存</button></div>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDbAuDZZAUCJ69Rqht_tokUao-yMaz2Rhw",authDomain:"trip-c496b.firebaseapp.com",projectId:"trip-c496b",storageBucket:"trip-c496b.firebasestorage.app",messagingSenderId:"376434234702",appId:"1:376434234702:web:879a29f655314c043efa1f"};
const app=initializeApp(firebaseConfig),fs=getFirestore(app);
const TK='futari-trip-id';
let TID=(location.hash.match(/^#t=([A-Za-z0-9_-]{12,40})$/)||[])[1];
try{if(!TID)TID=localStorage.getItem(TK)}catch(e){}
if(!TID)TID=Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
try{localStorage.setItem(TK,TID)}catch(e){}
history.replaceState(null,'','#t='+TID);
const bad=()=>{document.getElementById('sync').textContent='⚠ 同期エラー（ルールを確認）'};
const shim={
  doc:()=>{const r=doc(fs,'trips',TID,'meta','main');return{set:d=>setDoc(r,d),onSnapshot:(n)=>onSnapshot(r,x=>n({exists:x.exists(),data:()=>x.data()}),bad)}},
  collection:c=>{const cr=collection(fs,'trips',TID,c);return{doc:id=>{const r=doc(fs,'trips',TID,c,id);return{set:d=>setDoc(r,d),delete:()=>deleteDoc(r)}},onSnapshot:n=>onSnapshot(cr,q=>n({docs:q.docs.map(d=>({data:()=>d.data()}))}),bad)}}
};
const KEY='futari-trip-v1';
let S={title:'ふたりの旅',start:'',days:3,names:['自分','彼女'],items:[],pack:[],wish:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let cur=0,editId=null;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let db=null,mt;const ig=()=>{};
const syncMeta=()=>{if(!db)return save();clearTimeout(mt);mt=setTimeout(()=>db.doc('trip/meta').set({title:S.title,start:S.start,days:S.days,names:S.names}).catch(ig),400)};
const putItem=it=>{if(!db)return save();db.collection('items').doc(it.id).set(it).catch(ig)};
const rmItem=id=>{if(!db)return save();db.collection('items').doc(id).delete().catch(ig)};
const putPack=p=>{if(!db)return save();db.collection('pack').doc(p.id).set(p).catch(ig)};
const putWish=w=>{if(!db)return save();db.collection('wish').doc(w.id).set(w).catch(ig)};
const rmWish=id=>{if(!db)return save();db.collection('wish').doc(id).delete().catch(ig)};
const rmPack=id=>{if(!db)return save();db.collection('pack').doc(id).delete().catch(ig)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function dayDate(i){if(!S.start)return null;const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+i);return d}
const W=['日','月','火','水','木','金','土'];
function dayLabel(i){const d=dayDate(i);return d?`${d.getMonth()+1}/${d.getDate()}`:''}
function dayWk(i){const d=dayDate(i);return d?W[d.getDay()]:''}

function head(){
  if(document.activeElement!==$('title'))$('title').value=S.title;$('start').value=S.start;$('ndays').value=S.days;
  const c=$('countdown');
  if(S.start){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(S.start+'T00:00:00')-t)/864e5);
    c.innerHTML=n>0?`出発まで<b>${n}</b>日`:n===0?'今日出発！':'旅行中';}else c.textContent='';
}
function renderDays(){
  $('days').innerHTML=Array.from({length:S.days},(_,i)=>
    `<button aria-pressed="${i===cur}" data-d="${i}">${i+1}日目<small>${dayLabel(i)?dayLabel(i)+'（'+dayWk(i)+'）':'&nbsp;'}</small></button>`).join('');
}
const CATS={plane:['✈️','#5aa9e6'],train:['🚆','#2fb59b'],bus:['🚌','#7bb661'],food:['🍜','#f4a43a'],sight:['⛩️','#e4513a'],stay:['🏨','#9b8cf0'],other:['📌','#8a98b3']};
function kind(t){
  if(/バス/.test(t))return'bus';
  if(/電車|新幹線|地下鉄|駅|特急|JR|モノレール|鉄道|電鉄/.test(t))return'train';
  if(/飛行機|空港|フライト|航空/.test(t))return'plane';
  if(/ランチ|ディナー|朝食|昼食|夕食|カフェ|ラーメン|食|寿司|居酒屋|屋台|もつ鍋|レストラン|喫茶|バー|うどん/.test(t))return'food';
  if(/ホテル|宿|チェックイン|チェックアウト|旅館|民宿/.test(t))return'stay';
  if(/観光|神社|寺|城|公園|美術館|博物館|水族館|動物園|散策|散歩|温泉|展望|ショッピング|買い物|イルミ|タワー/.test(t))return'sight';
  return''}
function guess(x){const t=x.title||'';return kind(t)||(/タクシー|レンタカー|フェリー|徒歩|移動/.test(t)?'other':kind(t+(x.place||'')))||'other'}
function renderList(){
  const L=S.items.filter(x=>x.day===cur).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  $('list').innerHTML=L.length?L.map(x=>{const k=CATS[x.cat]?x.cat:guess(x),[ic,cc]=CATS[k];return `
  <div class="tk ${x.done?'done':''}" style="--cc:${cc}">
    <div class="stub"><div class="ic">${ic}</div><div class="tm">${x.time||'--:--'}</div></div>
    <div class="body" data-e="${x.id}">
      <div class="t">${esc(x.title)}</div>
      ${x.place?`<div class="sub"><a class="map" target="_blank" rel="noopener" href="https://maps.apple.com/?q=${encodeURIComponent(x.place)}">📍 ${esc(x.place)}</a></div>`:''}
      ${x.note?`<div class="sub">${esc(x.note)}</div>`:''}
      ${x.cost?`<span class="cost">${yen(x.cost)}${x.pay==='0'||x.pay==='1'?'（'+esc(S.names[+x.pay])+'）':''}</span>`:''}
      <div><button class="mini" data-ca="${x.id}" style="margin-top:8px">📅 カレンダーに追加</button></div>
    </div>
    <div class="side"><input type="checkbox" class="chk" data-c="${x.id}" ${x.done?'checked':''} aria-label="完了"><button class="del" data-x="${x.id}" aria-label="削除">×</button></div>
  </div>`}).join(''):`<div class="empty">この日の予定はまだありません。<br>「＋ 予定を追加」から入れてみましょう。</div>`;
}
let packF='all';
function renderPack(){
  const N=S.names,lab=['自分用','彼女用','共用'].map((t,i)=>i<2?N[i]+'用':t);
  [0,1,2].forEach(i=>{$('packOwner').options[i].textContent=lab[i]});
  const own=p=>p.o===undefined||p.o===''?'2':String(p.o);
  const cnt=k=>S.pack.filter(p=>k==='all'||own(p)===k).length;
  $('packTabs').innerHTML=[['all','すべて'],['0',lab[0]],['1',lab[1]],['2','共用']].map(([k,t])=>`<button data-pf="${k}" aria-pressed="${packF===k}">${esc(t)}<small>${cnt(k)}件</small></button>`).join('');
  const L=S.pack.filter(p=>packF==='all'||own(p)===packF);
  $('packList').innerHTML=L.length?L.map(p=>`
  <div class="item ${p.done?'done':''}" style="align-items:center">
    <input type="checkbox" class="chk" data-pc="${p.id}" ${p.done?'checked':''} aria-label="準備OK">
    <div class="body t">${esc(p.t)}</div>
    <button class="mini" data-po="${p.id}" aria-label="持ち主を変える">${esc(lab[+own(p)])}</button>
    <button class="del" data-px="${p.id}" aria-label="削除">×</button>
  </div>`).join(''):`<div class="empty">${S.pack.length?'この分類の持ち物はありません。':'持ち物リストは空です。<br>充電器やパスポートなど、忘れ物防止に。'}</div>`;
}
function renderCost(){
  const N=S.names,c=x=>+x.cost||0;
  const tot=S.items.reduce((a,x)=>a+c(x),0);
  const per=Array.from({length:S.days},(_,i)=>S.items.filter(x=>x.day===i).reduce((a,x)=>a+c(x),0));
  const paid=[0,0];let asg=0,unset=0;
  S.items.forEach(x=>{if(x.pay==='0'||x.pay==='1'){paid[+x.pay]+=c(x);asg+=c(x)}else unset+=c(x)});
  const diff=paid[0]-asg/2;
  const res=asg===0?'「支払った人」を入れると、精算額が出ます':Math.abs(diff)<1?'精算なし（ちょうど折半です）':`${esc(diff>0?N[1]:N[0])} → ${esc(diff>0?N[0]:N[1])} に <b>${yen(Math.abs(diff))}</b>`;
  $('cost').innerHTML=`<div class="sum"><div class="sub">合計</div><div class="big">${yen(tot)}</div>
  <div class="sub">ひとりあたり ${yen(tot/2)}</div></div>
  <div class="sum"><div style="font-weight:700;margin-bottom:4px">精算（折半）</div>
  <div class="big" style="font-size:20px;margin:6px 0">${res}</div>
  <div class="line"><span>${esc(N[0])}が払った</span><span>${yen(paid[0])}</span></div>
  <div class="line"><span>${esc(N[1])}が払った</span><span>${yen(paid[1])}</span></div>
  ${unset>0?`<div class="line"><span>支払った人が未設定</span><span>${yen(unset)}</span></div>`:''}
  <div class="meta" style="margin-top:10px"><label style="margin:0">名前 <input data-n="0" value="${esc(N[0])}" maxlength="10" style="width:90px"></label><label style="margin:0"><input data-n="1" value="${esc(N[1])}" maxlength="10" style="width:90px"></label></div></div>
  <div class="sum"><div style="font-weight:700;margin-bottom:4px">日ごとの費用</div>${per.map((v,i)=>`<div class="line"><span>${i+1}日目 ${dayLabel(i)}</span><span>${yen(v)}</span></div>`).join('')}</div>`;
}
let ALM=30;try{const v=localStorage.getItem('futari-alarm');if(v!==null)ALM=+v}catch(e){}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const hms=t=>ymd(t)+'T'+pad(t.getHours())+pad(t.getMinutes())+'00';
const ie=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function mkICS(list){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//futari-trip//JP','CALSCALE:GREGORIAN'];
  list.forEach(x=>{
    const d=dayDate(x.day);L.push('BEGIN:VEVENT','UID:'+x.id+'@futari-trip','DTSTAMP:'+now);
    if(x.time){const [h,m]=x.time.split(':').map(Number);const st=new Date(d);st.setHours(h,m,0,0);L.push('DTSTART:'+hms(st),'DTEND:'+hms(new Date(st.getTime()+36e5)))}
    else{const n=new Date(d);n.setDate(n.getDate()+1);L.push('DTSTART;VALUE=DATE:'+ymd(d),'DTEND;VALUE=DATE:'+ymd(n))}
    L.push('SUMMARY:'+ie(x.title));
    if(x.place)L.push('LOCATION:'+ie(x.place));
    if(x.note)L.push('DESCRIPTION:'+ie(x.note));
    if(x.time&&ALM>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie(x.title),'TRIGGER:-PT'+ALM+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function addCal(list){
  list=list.filter(Boolean);
  if(!S.start)return alert('先に、画面上部の「出発日」を入れてください。');
  if(!list.length)return alert('この日に追加できる予定がありません。');
  const u=URL.createObjectURL(new Blob([mkICS(list)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}
$('calDay').onclick=()=>addCal(S.items.filter(x=>x.day===cur));
$('alm').value=String(ALM);
$('alm').onchange=e=>{ALM=+e.target.value;try{localStorage.setItem('futari-alarm',String(ALM))}catch(x){}};
function renderWish(){
  const L=[...S.wish].sort((a,b)=>(a.at||0)-(b.at||0));
  $('wishList').innerHTML=L.length?L.map(w=>`
  <div class="item">
    <div class="body">
      <div class="t">${esc(w.title)}</div>
      ${w.place?`<div class="sub"><a class="map" target="_blank" rel="noopener" href="https://maps.apple.com/?q=${encodeURIComponent(w.place)}">📍 ${esc(w.place)}</a></div>`:''}
      <button class="mini" data-wm="${w.id}" style="margin-top:8px;color:var(--ac);font-weight:700">予定に入れる</button>
    </div>
    <button class="del" data-wx="${w.id}" aria-label="削除">×</button>
  </div>`).join(''):`<div class="empty">行きたい場所の候補はまだありません。<br>思いついたらここにためておいて、<br>決まったら予定に入れましょう。</div>`;
}
function all(){head();renderDays();renderList();renderPack();renderWish();renderCost()}

// events
$('title').oninput=e=>{S.title=e.target.value;syncMeta()};
$('start').onchange=e=>{S.start=e.target.value;syncMeta();all()};
$('ndays').onchange=e=>{S.days=Math.min(30,Math.max(1,+e.target.value||1));if(cur>=S.days)cur=S.days-1;syncMeta();all()};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['plan','wish','pack','cost'].forEach(t=>$(t).hidden=t!==b.dataset.tab);
  $('fab').hidden=b.dataset.tab!=='plan';};
$('days').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.d;renderDays();renderList()};
$('list').onclick=e=>{
  const ca=e.target.closest('[data-ca]');if(ca){addCal([S.items.find(i=>i.id===ca.dataset.ca)]);return}
  if(e.target.closest('a.map'))return;
  const c=e.target.closest('[data-c]'),x=e.target.closest('[data-x]'),ed=e.target.closest('[data-e]');
  if(c){const it=S.items.find(i=>i.id===c.dataset.c);it.done=c.checked;putItem(it);renderList()}
  else if(x){if(confirm('この予定を削除しますか？')){rmItem(x.dataset.x);S.items=S.items.filter(i=>i.id!==x.dataset.x);renderList();renderCost()}}
  else if(ed)openDlg(ed.dataset.e);
};
function openDlg(id){
  editId=id||null;const it=id?S.items.find(i=>i.id===id):{};
  $('dh').textContent=id?'予定を編集':`${cur+1}日目の予定を追加`;
  $('ftime').value=it.time||'';$('fcost').value=it.cost||'';$('ftitle').value=it.title||'';$('fplace').value=it.place||'';$('fnote').value=it.note||'';$('o0').textContent=S.names[0];$('o1').textContent=S.names[1];$('fpay').value=it.pay||'';$('fcat').value=it.cat||'';
  $('dlg').showModal();if(document.activeElement&&document.activeElement!==$('dlg'))document.activeElement.blur();
}
$('fab').onclick=()=>openDlg();
$('cancel').onclick=()=>$('dlg').close();
$('f').onsubmit=e=>{
  const v={time:$('ftime').value,cost:+$('fcost').value||0,title:$('ftitle').value.trim(),place:$('fplace').value.trim(),note:$('fnote').value.trim(),pay:$('fpay').value,cat:$('fcat').value};
  if(!v.title)return;
  let it;if(editId){it=S.items.find(i=>i.id===editId);Object.assign(it,v)}else{it={id:uid(),day:cur,done:false,...v};S.items.push(it)}
  putItem(it);renderList();renderCost();
};
$('wishForm').onsubmit=e=>{e.preventDefault();const t=$('wishT').value.trim();if(!t)return;const w={id:uid(),title:t,place:$('wishP').value.trim(),at:Date.now()};S.wish.push(w);$('wishT').value='';$('wishP').value='';putWish(w);renderWish()};
let moveId=null;
$('wishList').onclick=e=>{
  if(e.target.closest('a.map'))return;
  const m=e.target.closest('[data-wm]'),x=e.target.closest('[data-wx]');
  if(m){moveId=m.dataset.wm;const w=S.wish.find(i=>i.id===moveId);$('mh').textContent='「'+w.title+'」を予定に入れる';
    $('mday').innerHTML=Array.from({length:S.days},(_,i)=>`<option value="${i}">${i+1}日目 ${dayLabel(i)}</option>`).join('');$('mday').value=cur;$('mtime').value='';$('dlgM').showModal();if(document.activeElement&&document.activeElement!==$('dlgM'))document.activeElement.blur()}
  else if(x){if(confirm('この候補を削除しますか？')){rmWish(x.dataset.wx);S.wish=S.wish.filter(i=>i.id!==x.dataset.wx);renderWish()}}
};
$('mcancel').onclick=()=>$('dlgM').close();
$('fm').onsubmit=()=>{
  const w=S.wish.find(i=>i.id===moveId);if(!w)return;
  const it={id:uid(),day:+$('mday').value,done:false,time:$('mtime').value,cost:0,title:w.title,place:w.place||'',note:w.note||'',pay:''};
  S.items.push(it);putItem(it);rmWish(w.id);S.wish=S.wish.filter(i=>i.id!==w.id);
  cur=it.day;renderDays();renderList();renderCost();renderWish();
};
$('packForm').onsubmit=e=>{e.preventDefault();const v=$('packIn').value.trim();if(!v)return;const p={id:uid(),t:v,done:false,o:$('packOwner').value};S.pack.push(p);$('packIn').value='';putPack(p);renderPack()};
$('packTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;packF=b.dataset.pf;if(packF!=='all')$('packOwner').value=packF;renderPack()};
$('packList').onclick=e=>{
  const po=e.target.closest('[data-po]');
  if(po){const p=S.pack.find(p=>p.id===po.dataset.po);p.o=String(((p.o===undefined||p.o===''?2:+p.o)+1)%3);putPack(p);renderPack();return}
  const c=e.target.closest('[data-pc]'),x=e.target.closest('[data-px]');
  if(c){const p=S.pack.find(p=>p.id===c.dataset.pc);p.done=c.checked;putPack(p);renderPack()}
  else if(x){rmPack(x.dataset.px);S.pack=S.pack.filter(p=>p.id!==x.dataset.px);renderPack()}
};
$('cost').onchange=e=>{const i=e.target.dataset.n;if(i===undefined)return;S.names[+i]=e.target.value.trim()||(i==='0'?'自分':'彼女');syncMeta();renderCost();renderList();renderPack()};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('cp').textContent='コピーしました'}catch(e){prompt('このリンクを彼女に送ってください',location.href)}};
$('sw').onclick=()=>{const v=prompt('彼女から届いたリンクかコードを貼り付けてください');if(!v)return;const m=v.trim().match(/([A-Za-z0-9_-]{12,40})$/);if(!m)return alert('コードが正しくありません');try{localStorage.setItem(TK,m[1])}catch(e){}location.hash='t='+m[1];location.reload()};
all();
(async()=>{try{
  db=shim;
  $('sync').textContent='👫 ふたりで共有中';
  db.doc('trip/meta').onSnapshot(s=>{
    if(s.exists){const d=s.data();S.title=d.title??S.title;S.start=d.start||'';S.days=d.days||S.days;if(d.names)S.names=d.names;if(cur>=S.days)cur=S.days-1;all()}
    else{db.doc('trip/meta').set({title:S.title,start:S.start,days:S.days,names:S.names}).catch(ig);
      S.items.forEach(it=>db.collection('items').doc(it.id).set(it).catch(ig));S.pack.forEach(p=>db.collection('pack').doc(p.id).set(p).catch(ig))}
  },ig);
  db.collection('items').onSnapshot(q=>{S.items=q.docs.map(d=>d.data());renderList();renderCost()},ig);
  db.collection('pack').onSnapshot(q=>{S.pack=q.docs.map(d=>d.data());renderPack()},ig);
  db.collection('wish').onSnapshot(q=>{S.wish=q.docs.map(d=>d.data());renderWish()},ig);
}catch(e){}})();
</script>
</body>
</html>
