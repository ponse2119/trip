<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モリナビトラベル</title>
<meta name="apple-mobile-web-app-title" content="モリナビトラベル">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<meta property="og:title" content="モリナビトラベル">
<meta property="og:site_name" content="モリナビトラベル">
<meta property="og:type" content="website">
<meta property="og:description" content="ふたりの旅の予定・持ち物・費用をまとめて管理">
<meta name="description" content="ふたりの旅の予定・持ち物・費用をまとめて管理">
<meta name="theme-color" content="#eef4fb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#ffffff;--card2:#f4f7fc;--ink:#14213d;--sub:#5b6b8a;--line:#d6e0ee;--ac:#d9442e;--acink:#fff;--sun:#f7b23b;--link:#b34a12;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
button,input,textarea,select{font:inherit;color:inherit}
header{padding:8px 0 12px}
#title{width:100%;border:0;background:transparent;font:800 30px/1.3 "Shippori Mincho B1","Hiragino Mincho ProN",serif;padding:4px 0;border-bottom:2px dashed var(--line);letter-spacing:.02em}
#title:focus{outline:none;border-color:var(--sun)}
.meta{display:flex;gap:10px;margin-top:12px;align-items:center;color:var(--sub);font-size:14px;flex-wrap:wrap}
.meta input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px}
.meta input[type=number]{width:64px}
.count{margin-left:auto;background:var(--ac);color:var(--acink);border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px}
.count:empty{display:none}
.count b{font-size:22px;font-variant-numeric:tabular-nums;margin:0 2px}
nav.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:10px 0 16px;border:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-weight:700;color:var(--sub);cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--ac);color:var(--acink)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;text-align:center;cursor:pointer;line-height:1.35;font-weight:700}
.days button small{display:block;color:var(--sub);font-size:12px;font-weight:400}
.days button.today{border-color:var(--ac)}
.banner{background:color-mix(in srgb,var(--sun) 30%,#fff);border:1px solid var(--sun);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:700;font-size:14px}
#maint{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.mbox h1{font:800 28px "Shippori Mincho B1","Hiragino Mincho ProN",serif;margin:0 0 12px}
.mbox p{color:var(--sub);margin:0 0 24px;overflow-wrap:anywhere}
body.ro .fab,body.ro .add,body.ro .del,body.ro [data-wm]{display:none!important}
body.ro .chk,body.ro #title,body.ro .meta input,body.ro #cost input,body.ro [data-po]{pointer-events:none}
body.ro .tk .body,body.ro .item .body{cursor:default}
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rt{display:inline-block;text-decoration:none;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exr{padding:12px 0;border-top:1px solid var(--line)}
.exh{display:flex;gap:10px;justify-content:space-between;cursor:pointer}
.exr .ext{font-weight:700;font-size:16px}
.exr .pen{color:var(--sub);font-size:14px}
.exr .exs{color:var(--sub);font-size:13px}
.exr .exa{font-weight:700;font-size:17px;white-space:nowrap}
.exr.st .exh{opacity:.55}.exr.st .ext{text-decoration:line-through}
.chips{display:flex;margin-top:6px;flex-wrap:wrap;padding-left:4px}
.chip{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);margin-left:-4px;background:var(--card)}
.chip.on{border-color:color-mix(in srgb,var(--ac) 55%,#fff);color:var(--ink);background:color-mix(in srgb,var(--ac) 10%,#fff)}
.stb{display:inline-block;background:var(--line);color:var(--sub);border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;margin-left:6px}
.warn{color:var(--ac)}
.ok{color:#1b6b45;font-weight:700}
.cost.st{opacity:.6}
.mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px}
.item select.mini{max-width:112px}
body.ro #cost button{display:none}
body.ro .exh{pointer-events:none}
body.ro [data-bk]{display:none}
.gh{font:700 16px "Shippori Mincho B1","Hiragino Mincho ProN",serif;margin:18px 0 8px;padding-left:10px;border-left:4px solid var(--ac)}
.nx{display:inline-block;background:var(--ac);color:var(--acink);border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;margin-bottom:4px}
.tk.next{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.days button[aria-pressed=true]{background:var(--sun);color:#1a1204;border-color:var(--sun)}
.days button[aria-pressed=true] small{color:#3a2a0c}
.tk{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.tk::before,.tk::after{content:"";position:absolute;left:68px;width:16px;height:16px;border-radius:50%;background:var(--bg);z-index:1}
.tk::before{top:-8px}.tk::after{bottom:-8px}
.tk{box-shadow:0 1px 3px rgba(20,33,61,.08)}
.stub{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border-right:2px dashed var(--line);background:color-mix(in srgb,var(--cc) 20%,#fff);border-radius:13px 0 0 13px}
.stub .ic{font-size:26px;line-height:1}
.stub .tm{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tk .body{flex:1;min-width:0;padding:12px 8px 12px 14px;cursor:pointer}
.tk .side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px 6px 0}
.tk.done{opacity:.5}.tk.done .t{text-decoration:line-through}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.item.done{opacity:.5}.item.done .t{text-decoration:line-through}
.body{flex:1;min-width:0}
.t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.sub{color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.cost{display:inline-block;background:color-mix(in srgb,var(--sun) 24%,transparent);border-radius:8px;padding:0 8px;font-size:13px;margin-top:6px}
.chk{width:24px;height:24px;accent-color:var(--ac);flex:0 0 auto}
.del{border:0;background:none;color:var(--sub);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
.add select{max-width:112px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 8px;font-size:15px}
.mini{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:4px 10px;font-size:13px;cursor:pointer}
.map{color:var(--link);text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;color:var(--sub);padding:36px 12px;border:2px dashed var(--line);border-radius:14px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acink);border:0;border-radius:28px;padding:14px 22px;font-weight:700;box-shadow:0 6px 16px rgba(217,68,46,.35);cursor:pointer}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);width:calc(100% - 24px);max-width:520px;max-height:calc(100% - 24px);overflow:auto;padding:18px;margin:auto auto 12px}
dialog::backdrop{background:rgba(20,33,61,.45)}
dialog h2{margin:0 0 10px;font:800 19px "Shippori Mincho B1","Hiragino Mincho ProN",serif}
label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
dialog input:not([type=checkbox]),dialog select{height:46px;min-width:0}
dialog input[type=time]{-webkit-appearance:none;appearance:none;text-align:left;display:block}
dialog input[type=time]::-webkit-date-and-time-value{text-align:left}
dialog:focus{outline:none}
.phs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ph{position:relative;width:72px;height:72px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.ph button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0}
.phadd{width:72px;height:72px;border:2px dashed var(--line);border-radius:10px;background:none;color:var(--sub);font-size:26px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;border-radius:12px;padding:12px;border:1px solid var(--line);background:none;font-weight:700;cursor:pointer}
.acts .pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}
.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:16px}
.add button{border:0;background:var(--ac);color:var(--acink);border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="banner" id="banner" hidden></div>
<header>
  <div style="display:flex;justify-content:flex-end"><button class="mini" id="trips" type="button">旅の一覧 ▾</button></div>
  <input id="title" aria-label="旅のタイトル" placeholder="旅のタイトル" maxlength="40">
  <div class="meta">
    <label style="margin:0">出発日 <input type="date" id="start"></label>
    <label style="margin:0">日数 <input type="number" id="ndays" min="1" max="30"></label>
    <label style="margin:0">行き先 <input id="dest" maxlength="20" placeholder="例：福岡（天気用）" style="width:150px"></label>
    <span class="count" id="countdown"></span>
  </div>
  <div class="sub" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="sync">📱 この端末のみ保存</span><button id="cp" class="mini">リンクをコピー</button><button id="sw" class="mini">コード入力</button><button id="adm" class="mini" type="button">管理</button></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true">予定</button>
  <button role="tab" data-tab="wish" aria-selected="false">候補</button>
  <button role="tab" data-tab="pack" aria-selected="false">持ち物</button>
  <button role="tab" data-tab="cost" aria-selected="false">費用</button>
</nav>

<section id="plan">
  <div class="days" id="days"></div>
  <div class="sub" id="wxline" hidden style="margin:0 0 10px"></div>
  <div style="margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="mini" id="calDay">📅 この日をまとめてカレンダーへ</button><label class="sub" style="margin:0">通知 <select id="alm" class="mini"><option value="0">なし</option><option value="10">10分前</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">1日前</option></select></label><label class="sub" style="margin:0">経路 <select id="rmode" class="mini"><option value="r">電車・バス</option><option value="w">徒歩</option><option value="d">車</option></select></label></div>
  <div id="list"></div>
</section>
<section id="wish" hidden>
  <form class="add" id="wishForm" style="flex-wrap:wrap"><input id="wishT" style="flex:1 1 100%" required maxlength="60" placeholder="行きたい場所・やりたいこと" aria-label="候補"><input id="wishP" maxlength="80" placeholder="場所（任意）" aria-label="場所"><select id="wishDay" aria-label="日にち"></select><button>追加</button></form>
  <div class="days" id="wishTabs"></div>
  <div id="wishList"></div>
</section>
<section id="pack" hidden>
  <form class="add" id="packForm"><input id="packIn" placeholder="持ち物を追加" aria-label="持ち物"><select id="packOwner" aria-label="誰の持ち物"><option value="0"></option><option value="1"></option><option value="2">共用</option></select><button>追加</button></form>
  <div class="days" id="packTabs"></div>
  <div id="packList"></div>
</section>
<section id="cost" hidden></section>
</main>

<button class="fab" id="fab">＋ 予定を追加</button>

<dialog id="dlgW" autofocus tabindex="-1">
  <form method="dialog" id="fw">
    <h2>候補を編集</h2>
    <label for="wday">日にち</label><select id="wday"></select>
    <label for="wt">やりたいこと</label><input id="wt" required maxlength="60">
    <label for="wp">場所</label><input id="wp" maxlength="80">
    <label for="wn">メモ</label><textarea id="wn" rows="2" maxlength="200"></textarea>
    <div class="acts"><button type="button" id="wcancel">キャンセル</button><button class="pri">保存</button></div>
  </form>
</dialog>

<dialog id="dlgM" autofocus tabindex="-1">
  <form method="dialog" id="fm">
    <h2 id="mh">予定に入れる</h2>
    <div class="row">
      <div><label for="mday">何日目</label><select id="mday"></select></div>
      <div><label for="mtime">時間（任意）</label><input type="time" id="mtime"></div>
    </div>
    <div class="acts"><button type="button" id="mcancel">キャンセル</button><button class="pri">予定に入れる</button></div>
  </form>
</dialog>

<div id="maint" hidden><div class="mbox"><h1>メンテナンス中</h1><p id="mtext"></p><button class="mini" id="madm" type="button">管理者の方はこちら</button></div></div>

<dialog id="dlgA" autofocus tabindex="-1">
  <h2>管理</h2>
  <div id="abody"></div>
  <div class="acts"><button type="button" id="aclose">閉じる</button></div>
</dialog>

<dialog id="dlgT" autofocus tabindex="-1">
  <h2>旅の一覧</h2>
  <div id="tlist"></div>
  <div class="acts"><button type="button" id="tclose">閉じる</button><button type="button" id="tfnew">＋ フォルダ</button><button type="button" class="pri" id="tnew">＋ 新しい旅</button></div>
</dialog>

<dialog id="dlgP" autofocus tabindex="-1" style="padding:10px"><img id="pimg" alt="写真" style="width:100%;max-height:80vh;object-fit:contain;border-radius:12px;display:block"><div class="acts"><button type="button" id="pclose">閉じる</button></div></dialog>

<dialog id="dlg" autofocus tabindex="-1">
  <form method="dialog" id="f">
    <h2 id="dh">予定を追加</h2>
    <label for="fday">日にち</label><select id="fday"></select>
    <div class="row">
      <div><label for="ftime">時間</label><input type="time" id="ftime"></div>
      <div><label for="fcost">費用（円）</label><input type="number" id="fcost" inputmode="numeric" min="0" placeholder="0"></div>
    </div>
    <label for="fcat">種類</label><select id="fcat"><option value="">おまかせ（自動）</option><option value="plane">✈️ 飛行機</option><option value="train">🚆 電車</option><option value="bus">🚌 バス</option><option value="food">🍜 食事</option><option value="sight">⛩️ 観光</option><option value="stay">🏨 宿泊</option><option value="other">📌 その他</option></select>
    <label for="fpay">支払った人（精算に使います）</label><select id="fpay"></select>
    <label>精算の対象（誰のための費用か）</label><div class="days" id="fshare" style="flex-wrap:wrap"></div>
    <label for="ftitle">やること</label><input id="ftitle" required maxlength="60" placeholder="例：清水寺を散歩">
    <label for="fplace">場所</label><input id="fplace" maxlength="80" placeholder="例：京都市東山区">
    <label for="fnote">メモ</label><textarea id="fnote" rows="2" maxlength="200" placeholder="予約番号、持っていくものなど"></textarea>
    <label>写真（最大4枚）</label><div class="phs" id="phs"></div><input type="file" id="phin" accept="image/*" multiple hidden>
    <div class="acts"><button type="button" id="cancel">キャンセル</button><button class="pri" id="save">保存</button></div>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDbAuDZZAUCJ69Rqht_tokUao-yMaz2Rhw",authDomain:"trip-c496b.firebaseapp.com",projectId:"trip-c496b",storageBucket:"trip-c496b.firebasestorage.app",messagingSenderId:"376434234702",appId:"1:376434234702:web:879a29f655314c043efa1f"};
const app=initializeApp(firebaseConfig);
let fs;try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=getFirestore(app)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const TK='futari-trip-id';
let TID=(location.hash.match(/^#t=([A-Za-z0-9_-]{12,40})$/)||[])[1];
try{if(!TID)TID=localStorage.getItem(TK)}catch(e){}
if(!TID)TID=Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
try{localStorage.setItem(TK,TID)}catch(e){}
history.replaceState(null,'','#t='+TID);
const bad=()=>{document.getElementById('sync').textContent='⚠ 同期エラー（ルールを確認）'};
const shim={
  doc:()=>{const r=doc(fs,'trips',TID,'meta','main');return{set:d=>setDoc(r,d,{merge:true}),onSnapshot:(n)=>onSnapshot(r,x=>n({exists:x.exists(),data:()=>x.data()}),bad)}},
  collection:c=>{const cr=collection(fs,'trips',TID,c);return{doc:id=>{const r=doc(fs,'trips',TID,c,id);return{set:d=>setDoc(r,d),delete:()=>deleteDoc(r)}},onSnapshot:n=>onSnapshot(cr,q=>n({docs:q.docs.map(d=>({data:()=>d.data()}))}),bad)}}
};
const KEY='futari-trip-v1';
let S={title:'ふたりの旅',start:'',days:3,members:[{id:'0',name:'自分'},{id:'1',name:'彼女'}],settle:[],dest:'',mode:'normal',mmsg:'',pw:'',items:[],pack:[],wish:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let cur=0,editId=null;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let db=null,mt;const ig=()=>{};
const syncMeta=()=>{if(RO())return;if(!db)return save();clearTimeout(mt);mt=setTimeout(()=>db.doc('trip/meta').set({title:S.title,start:S.start,days:S.days,members:S.members,names:S.members.map(m=>m.name),dest:S.dest||''}).catch(ig),400)};
const putItem=it=>{if(RO())return;if(!db)return save();db.collection('items').doc(it.id).set(it).catch(ig)};
const rmItem=id=>{if(RO())return;if(!db)return save();db.collection('items').doc(id).delete().catch(ig)};
const putPack=p=>{if(RO())return;if(!db)return save();db.collection('pack').doc(p.id).set(p).catch(ig)};
const putSettle=r=>{if(RO())return;if(!db)return save();db.collection('settle').doc(r.id).set(r).catch(ig)};
const rmSettle=id=>{if(RO())return;if(!db)return save();db.collection('settle').doc(id).delete().catch(ig)};

function shareMap(x){const sh=shareIds(x),k=sh.length,v=+x.cost||0,base=Math.floor(v/k),r=v-base*k,m={};sh.forEach((id,j)=>{m[id]=base+(j<r?1:0)});return m}

function calc(){
  const ids=mIds(),paidAll={},bal={};ids.forEach(i=>{paidAll[i]=0;bal[i]=0});
  let unset=0,asg=0;
  S.items.forEach(x=>{const v=+x.cost||0;if(!v)return;
    if(!ids.includes(x.pay)){unset+=v;return}
    paidAll[x.pay]+=v;
    if(x.settled)return;
    const sm=shareMap(x);bal[x.pay]+=v;asg+=v;
    Object.keys(sm).forEach(id=>{bal[id]-=sm[id];if(id!==x.pay&&(x.sp||[]).includes(id)){bal[id]+=sm[id];bal[x.pay]-=sm[id]}});
  });
  S.settle.filter(r=>!r.done).forEach(r=>{if(r.from in bal)bal[r.from]+=r.amount;if(r.to in bal)bal[r.to]-=r.amount});
  const deb=ids.filter(i=>bal[i]<0).map(i=>({id:i,a:-bal[i]})).sort((a,b)=>b.a-a.a);
  const cre=ids.filter(i=>bal[i]>0).map(i=>({id:i,a:bal[i]})).sort((a,b)=>b.a-a.a);
  const plan=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){const t=Math.min(deb[i].a,cre[j].a);if(t>0)plan.push({from:deb[i].id,to:cre[j].id,a:t});deb[i].a-=t;cre[j].a-=t;if(deb[i].a<=0)i++;if(cre[j].a<=0)j++}
  return{paidAll,bal,plan,asg,unset};
}

const ymd=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const hms=t=>ymd(t)+'T'+pad(t.getHours())+pad(t.getMinutes())+'00';
const ie=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function mkICS(list){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//futari-trip//JP','CALSCALE:GREGORIAN'];
  list.forEach(x=>{
    const d=dayDate(x.day);L.push('BEGIN:VEVENT','UID:'+x.id+'@futari-trip','DTSTAMP:'+now);
    if(x.time){const [h,m]=x.time.split(':').map(Number);const st=new Date(d);st.setHours(h,m,0,0);L.push('DTSTART:'+hms(st),'DTEND:'+hms(new Date(st.getTime()+36e5)))}
    else{const n=new Date(d);n.setDate(n.getDate()+1);L.push('DTSTART;VALUE=DATE:'+ymd(d),'DTEND;VALUE=DATE:'+ymd(n))}
    L.push('SUMMARY:'+ie(x.title));
    if(x.place)L.push('LOCATION:'+ie(x.place));
    if(x.note)L.push('DESCRIPTION:'+ie(x.note));
    if(x.time&&ALM>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie(x.title),'TRIGGER:-PT'+ALM+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function addCal(list){
  list=list.filter(Boolean);
  if(!S.start)return alert('先に、画面上部の「出発日」を入れてください。');
  if(!list.length)return alert('この日に追加できる予定がありません。');
  const u=URL.createObjectURL(new Blob([mkICS(list)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}

const WC=c=>c===0?['☀️','晴れ']:c<=2?['🌤️','晴れ時々くもり']:c===3?['☁️','くもり']:c<=48?['🌫️','霧']:c<=57?['🌦️','霧雨']:c<=67?['🌧️','雨']:c<=77?['❄️','雪']:c<=82?['🌦️','にわか雨']:c<=86?['❄️','雪']:['⛈️','雷雨'];
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
async function loadWeather(){
  if(!S.dest||!S.start){WX={};wxKey='';renderDays();return}
  const key=S.dest+'|'+S.start+'|'+S.days;if(key===wxKey)return;wxKey=key;
  const t0=new Date();t0.setHours(0,0,0,0);const idx=[];
  for(let i=0;i<S.days;i++){const df=Math.round((dayDate(i)-t0)/864e5);if(df>=0&&df<=15)idx.push(i)}
  if(!idx.length){WX={};renderDays();return}
  try{
    const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(S.dest)+'&language=ja&count=1')).json();
    const p=g.results&&g.results[0];if(!p){WX={};renderDays();return}
    const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${iso(dayDate(idx[0]))}&end_date=${iso(dayDate(idx[idx.length-1]))}`)).json();
    const o={};r.daily.time.forEach((t,k)=>{const i=idx.find(j=>iso(dayDate(j))===t);if(i!==undefined)o[i]={c:r.daily.weather_code[k],hi:Math.round(r.daily.temperature_2m_max[k]),lo:Math.round(r.daily.temperature_2m_min[k]),pop:r.daily.precipitation_probability_max[k]}});
    WX=o;
  }catch(e){WX={};wxKey=''}
  renderDays();
}

$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('cp').textContent='コピーしました'}catch(e){prompt('このリンクを、一緒に使う人に送ってください',location.href)}};
$('sw').onclick=()=>{const v=prompt('共有されたリンクかコードを貼り付けてください');if(!v)return;const m=v.trim().match(/([A-Za-z0-9_-]{12,40})$/);if(!m)return alert('コードが正しくありません');try{localStorage.setItem(TK,m[1])}catch(e){}location.hash='t='+m[1];location.reload()};
all();
(async()=>{try{
  db=shim;
  setSync();
  db.doc('trip/meta').onSnapshot(s=>{
    if(s.exists){const d=s.data();S.title=d.title??S.title;S.start=d.start||'';S.days=d.days||S.days;if(Array.isArray(d.members)&&d.members.length)S.members=d.members;else if(Array.isArray(d.names)&&d.names.length)S.members=d.names.map((n,i)=>({id:String(i),name:n}));S.dest=d.dest||'';S.mode=d.mode||'normal';S.mmsg=d.mmsg||'';S.pw=d.pw||'';if(!didAuto&&S.start){didAuto=true;const t0=new Date();t0.setHours(0,0,0,0);const k=Math.round((t0-new Date(S.start+'T00:00:00'))/864e5);if(k>=0&&k<S.days)cur=k}
      if(cur>=S.days)cur=S.days-1;all();loadWeather()}
    else{db.doc('trip/meta').set({title:S.title,start:S.start,days:S.days,members:S.members,names:S.members.map(m=>m.name),dest:S.dest||''}).catch(ig);
      }
  },ig);
  db.collection('items').onSnapshot(q=>{S.items=q.docs.map(d=>d.data());renderList();renderCost()},ig);
  db.collection('pack').onSnapshot(q=>{S.pack=q.docs.map(d=>d.data());renderPack()},ig);
  db.collection('settle').onSnapshot(q=>{S.settle=q.docs.map(d=>d.data());renderCost();renderList()},ig);
  db.collection('wish').onSnapshot(q=>{S.wish=q.docs.map(d=>d.data());renderWish()},ig);
}catch(e){}})();
</script>
